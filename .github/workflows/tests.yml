name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.6'
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run simulated host, MIDI and MCP tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Check MCP handshake and schema
        run: uv run --locked python scripts/check_mcp.py
      - name: Verify generated tool manifest
        run: git diff --exit-code -- tool_manifest.json
